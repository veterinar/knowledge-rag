name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-versions:
    name: Verify tag == package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert tag matches pyproject, mcp_server and npm versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          PKG="$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("mcp_server/__init__.py").read()).group(1))')"
          NPM="$(node -p 'require("./npm/package.json").version')"
          echo "tag=${TAG} pyproject=${PY} mcp_server=${PKG} npm=${NPM}"
          test "${TAG}" = "${PY}" && test "${TAG}" = "${PKG}" && test "${TAG}" = "${NPM}"

  build:
    name: Build Distribution (reproducible)
    needs: verify-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Build toolchain comes from the hash-locked build lock ONLY — no
      # floating `build`/`pip-tools` installs — and the wheel/sdist are
      # built with --no-isolation so hatchling is exactly the locked one.
      # pip itself is hash-pinned inside the build lock (no upgrade).
      - run: pip install --require-hashes -r build-requirements.lock
      - run: python -m build --no-isolation
      - name: Release verification receipt
        # Release-side evidence — deliberately DISTINCT from a generation
        # receipt (which records installed RECORD + runtime identities and
        # never a wheel SHA). This receipt records the built artifact
        # identity bound to the EXACT GITHUB_SHA Git tree (read via
        # read-only git plumbing, never mutable worktree bytes): wheel SHA,
        # sorted archive manifest with per-entry hashes, actual build tool
        # versions, runtime/build lock digests, the parsed force-include
        # mapping with per-entry tree/wheel SHA parity, embedded-lock ==
        # tree-lock equality, and a full wheel-vs-tree package-file drift
        # comparison.
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p release-evidence
          python scripts/release_receipt.py dist release-evidence/release-verification.json
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          retention-days: 5
      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: release-evidence/
          retention-days: 90

  publish-pypi:
    name: Publish to PyPI
    # Publication waits for the exact-wheel verification, not merely the
    # build: a wheel that fails clean-venv install is never published.
    needs: [build, verify-wheel]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify-wheel:
    name: Verify exact wheel in clean venv
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      # The release does NOT rerun the full suite (CI already ran it on the
      # PR head). This verifies the EXACT published wheel: runtime lock +
      # wheel --no-deps + pip check + import/init smoke.
      - name: Clean venv install of the exact wheel
        shell: python
        run: |
          import os, pathlib, subprocess, venv

          root = pathlib.Path(os.environ.get("GITHUB_WORKSPACE", "."))
          vdir = root / ".release-verify-venv"

          def py(venv_dir):
              subdir = "Scripts" if os.name == "nt" else "bin"
              exe = "python.exe" if os.name == "nt" else "python"
              return str(venv_dir / subdir / exe)

          def run(cmd):
              print("+", " ".join(cmd), flush=True)
              subprocess.check_call(cmd, cwd=str(root))

          venv.EnvBuilder(with_pip=True, clear=True).create(vdir)
          run([py(vdir), "-m", "pip", "install", "--require-hashes", "-r", "requirements.lock"])
          wheels = sorted((root / "dist").glob("*.whl"))
          # EXACTLY ONE wheel — never first-vs-last selection: two wheels in
          # the artifact is an ambiguity that must fail, not be resolved.
          assert len(wheels) == 1, f"expected exactly one wheel, found {len(wheels)}: {[w.name for w in wheels]}"
          run([py(vdir), "-m", "pip", "install", "--no-deps", str(wheels[0])])
          run([py(vdir), "-m", "pip", "check"])
          run([py(vdir), "-c", "import mcp_server, importlib.metadata as im; assert im.version('knowledge-rag') == mcp_server.__version__; print('self-version parity ok')"])
          run([py(vdir), "-c", "from mcp_server import Config; print('init smoke ok')"])
          raise SystemExit(0)

  publish-npm:
    name: Publish to NPM
    needs: [publish-pypi, verify-wheel]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Sync version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${VERSION}';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - name: Copy LICENSE and README
        run: |
          cp LICENSE npm/LICENSE
          cp README.md npm/README.md
      - name: Publish to NPM
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"

  publish-docker:
    name: Push Docker Image (exact wheel)
    # Docker publication also waits for the exact-wheel verification.
    needs: [build, verify-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The image must be built from the EXACT wheel the release verified —
      # download the python-dist artifact into dist/ before docker build.
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      # The deployment receipt needs the wheel SHA from the release
      # verification receipt produced by the build job.
      - uses: actions/download-artifact@v8
        with:
          name: release-evidence
          path: release-evidence/
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/knowledge-rag
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        id: docker_push
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deployment receipt (image digest + exact wheel SHA)
        # DEPLOYMENT receipt — deliberately DISTINCT from both the release
        # verification receipt and any runtime installed-RECORD evidence.
        # Binds the pushed image digest to the exact wheel SHA the release
        # verified and the commit SHA. Fails if any value is missing.
        shell: python
        env:
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.docker_push.outputs.digest }}
        run: |
          import hashlib, json, os, pathlib, sys

          root = pathlib.Path(os.environ.get("GITHUB_WORKSPACE", "."))
          sha = os.environ.get("GITHUB_SHA", "")
          digest = os.environ.get("IMAGE_DIGEST", "")
          receipt_path = root / "release-evidence" / "release-verification.json"

          assert sha, "GITHUB_SHA missing — cannot bind deployment receipt"
          assert digest, "docker push digest missing — cannot bind deployment receipt"
          assert receipt_path.is_file(), "release-verification.json not downloaded"

          verification = json.loads(receipt_path.read_text(encoding="utf-8"))
          wheel_sha = verification.get("wheel_sha256", "")
          wheel_name = verification.get("wheel", "")
          assert wheel_sha, "release verification receipt lacks wheel_sha256"
          assert wheel_name, "release verification receipt lacks wheel name"

          # Cross-check: the wheel actually present in dist/ must be the
          # one the verification receipt hashed.
          wheels = sorted((root / "dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected exactly one wheel, found {len(wheels)}"
          h = hashlib.sha256()
          with open(wheels[0], "rb") as fh:
              for chunk in iter(lambda: fh.read(1 << 16), b""):
                  h.update(chunk)
          assert h.hexdigest() == wheel_sha, "dist wheel SHA != verification receipt wheel_sha256"
          assert wheels[0].name == wheel_name, "dist wheel name != verification receipt wheel"

          receipt = {
              "receipt_type": "docker-deployment",
              "github_sha": sha,
              "image_digest": digest,
              "wheel": wheel_name,
              "wheel_sha256": wheel_sha,
          }
          out = root / "deployment-receipt.json"
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(receipt, indent=2))
          sys.exit(0)
      - uses: actions/upload-artifact@v7
        with:
          name: deployment-receipt
          path: deployment-receipt.json
          retention-days: 90

  # ── Optional post-publish step ──────────────────────────────────────────
  #
  # If the release body contains a line of the form:
  #   YANKS: v4.7.0
  #   YANKS: v4.7.0 — reason string
  # then, after the new version is published, this job:
  #   • yanks the listed version from PyPI
  #   • deprecates the listed version on NPM
  # so `pip install <pkg>` and `npm install <pkg>` skip the superseded release
  # by default (users pinned to it still get it, with a warning).
  #
  # Requires the PYPI_API_TOKEN repo secret (classic scoped token). If the
  # secret is missing the PyPI step is skipped and only NPM deprecation runs.
  # Missing NPM_TOKEN also degrades gracefully.
  yank-superseded:
    name: Yank Superseded Version
    needs: [publish-pypi, publish-npm, publish-docker]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' && github.event.release.body != '' }}
    steps:
      - name: Parse YANKS marker from release body
        id: parse
        env:
          BODY: ${{ github.event.release.body }}
        run: |
          # Match: YANKS: v1.2.3   OR   YANKS: v1.2.3 — some reason
          line=$(printf '%s\n' "$BODY" | grep -iE '^[[:space:]]*YANKS:[[:space:]]*v?[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
          if [ -z "$line" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No YANKS marker in release body — skipping."
            exit 0
          fi
          version=$(printf '%s\n' "$line" | sed -E 's/.*YANKS:[[:space:]]*v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/i')
          reason=$(printf '%s\n' "$line" | sed -E 's/^[^—-]*[—-][[:space:]]*//; t; s/.*//')
          if [ -z "$reason" ]; then
            reason="Superseded by ${GITHUB_REF_NAME}. Behavior-identical release available."
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Will yank v${version}: ${reason}"

      - name: Yank on PyPI
        if: ${{ steps.parse.outputs.found == 'true' && env.PYPI_API_TOKEN != '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          VERSION: ${{ steps.parse.outputs.version }}
          REASON: ${{ steps.parse.outputs.reason }}
        run: |
          # Warehouse yank endpoint accepts classic PyPI API tokens
          # (Trusted Publisher OIDC tokens are publish-only right now).
          # Idempotent: PyPI returns 200 even if already yanked.
          http=$(curl -sS -o /tmp/yank.out -w "%{http_code}" \
            -X POST \
            -u "__token__:${PYPI_API_TOKEN}" \
            --data-urlencode "confirm_project_name=knowledge-rag" \
            --data-urlencode "_method=PUT" \
            --data-urlencode "yanked=true" \
            --data-urlencode "yanked_reason=${REASON}" \
            "https://pypi.org/manage/project/knowledge-rag/release/${VERSION}/" \
            || echo "curl-failed")
          echo "PyPI yank v${VERSION} → HTTP ${http}"
          cat /tmp/yank.out || true
          if [ "$http" != "200" ] && [ "$http" != "303" ]; then
            echo "::warning::PyPI yank returned HTTP ${http} — verify manually at https://pypi.org/manage/project/knowledge-rag/release/${VERSION}/"
          fi

      - name: Skip PyPI yank (no token)
        if: ${{ steps.parse.outputs.found == 'true' && env.PYPI_API_TOKEN == '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "::warning::PYPI_API_TOKEN secret not set — cannot yank on PyPI. Do it manually at https://pypi.org/manage/project/knowledge-rag/release/${{ steps.parse.outputs.version }}/"

      - name: Deprecate on NPM
        if: ${{ steps.parse.outputs.found == 'true' && env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.parse.outputs.version }}
          REASON: ${{ steps.parse.outputs.reason }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          # Idempotent: re-deprecating overwrites the message with no error.
          npm deprecate "knowledge-rag@${VERSION}" "${REASON}"
          echo "NPM deprecate v${VERSION} → done"

      - name: Skip NPM deprecate (no token)
        if: ${{ steps.parse.outputs.found == 'true' && env.NPM_TOKEN == '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "::warning::NPM_TOKEN secret not set — cannot deprecate on NPM."
